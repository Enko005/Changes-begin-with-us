<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Опитування</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green-dark: #1b5e20;
    --green: #2e7d32;
    --green-mid: #43a047;
    --green-light: #a5d6a7;
    --green-pale: #e8f5e9;
    --white: #ffffff;
    --text: #1f2d20;
    --muted: #5a6b5c;
  }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--green-pale);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden; /* Защита от горизонтального скролла */
  }

  header {
    background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
    color: var(--white);
    padding: 60px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -50%; left: -10%;
    width: 500px; height: 500px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -80%; right: -5%;
    width: 400px; height: 400px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
  }
  header h1 {
    font-size: 2.4rem;
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
    letter-spacing: 0.5px;
  }
  header p {
    font-size: 1.1rem;
    opacity: 0.92;
    position: relative;
    z-index: 1;
    max-width: 620px;
    margin: 0 auto;
  }

  .container {
    max-width: 1300px; 
    margin: 0 auto;
    padding: 60px 24px;
  }

  .section-title {
    text-align: center;
    font-size: 1.9rem;
    color: var(--green-dark);
    margin-bottom: 24px;
  }

  /* === ГАЛЕРЕЯ === */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px; 
    margin-bottom: 80px;
    align-items: start; 
  }
  .gallery-item {
    background: transparent; 
    border-radius: 18px;
    overflow: hidden;
  }
  
  .gallery-item img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 18px; 
    box-shadow: 0 10px 30px rgba(27, 94, 32, 0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  
  .gallery-item:hover img {
    transform: translateY(-6px);
    box-shadow: 0 16px 40px rgba(27, 94, 32, 0.25);
  }

  /* === БОЛЬШИЕ БЛОКИ === */
  .embed-block {
    background: var(--white);
    border-radius: 22px;
    padding: 30px;
    margin-bottom: 50px;
    box-shadow: 0 12px 40px rgba(27, 94, 32, 0.12);
    border-top: 6px solid var(--green-mid);
  }
  .embed-block h2 {
    color: var(--green-dark);
    margin-bottom: 8px;
    font-size: 1.5rem;
    text-align: center;
  }
  .embed-block .hint {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 22px;
  }
  
  iframe {
    width: 100%;
    border: none;
    border-radius: 12px;
    background: var(--green-pale);
    display: block;
  }
  #form-iframe  { min-height: 900px; }

  /* === СЕТКА ГРАФИКОВ === */
  .charts-grid {
    display: grid;
    /* Уменьшили минимальный размер до 280px для узких экранов */
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
    gap: 30px;
    margin-top: 20px;
  }
  .chart-item {
    background: var(--white);
    border: 1px solid var(--green-light);
    border-radius: 16px;
    padding: 15px;
    box-shadow: 0 8px 25px rgba(27, 94, 32, 0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chart-item:hover {
    transform: translateY(-5px);
    box-shadow: 0 14px 35px rgba(27, 94, 32, 0.25);
  }
  .chart-item img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    display: block;
    cursor: zoom-in;
  }

  /* === МОДАЛЬНОЕ ОКНО === */
  .modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(27, 94, 32, 0.85);
    backdrop-filter: blur(5px);
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .modal.active {
    display: flex;
    opacity: 1;
  }
  .modal-content {
    max-width: 95%;
    max-height: 90vh;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transform: scale(0.7);
    transition: transform 0.3s ease;
    background: var(--white);
  }
  .modal.active .modal-content {
    transform: scale(1);
  }
  .modal-close {
    position: absolute;
    top: 20px;
    right: 35px;
    color: var(--white);
    font-size: 50px;
    font-weight: bold;
    cursor: pointer;
    transition: color 0.3s;
    line-height: 1;
    user-select: none;
  }
  .modal-close:hover {
    color: var(--green-light);
  }

  footer {
    background: var(--green-dark);
    color: var(--white);
    text-align: center;
    padding: 30px 20px;
    font-size: 0.9rem;
    opacity: 0.95;
  }
  footer span { color: var(--green-light); font-weight: 600; }

  /* ========================================= */
  /* === АДАПТИВНОСТЬ (МЕДИА-ЗАПРОСЫ) === */
  /* ========================================= */

  /* Планшеты (ширина до 960px) */
  @media (max-width: 960px) {
    .gallery { 
      grid-template-columns: 1fr 1fr; 
    }
    /* Убрали растягивание третьей картинки на 2 колонки, 
       чтобы она не выглядела больше остальных */
  }

  /* Маленькие планшеты и большие телефоны (до 768px) */
  @media (max-width: 768px) {
    header { padding: 50px 16px; }
    header h1 { font-size: 2rem; }
    header p { font-size: 1rem; }
    .container { padding: 40px 16px; }
    .embed-block { padding: 24px 16px; }
  }

  /* Телефоны (до 560px) */
  @media (max-width: 560px) {
    header { padding: 40px 15px; }
    header h1 { font-size: 1.8rem; }
    
    .gallery { 
      grid-template-columns: 1fr; /* Картинки в один столбик */
      gap: 20px;
    }
    
    .section-title { font-size: 1.6rem; margin-bottom: 16px; }
    
    .embed-block { 
      padding: 20px 15px; 
      margin-bottom: 30px;
      border-radius: 16px;
    }
    .embed-block h2 { font-size: 1.3rem; }
    .embed-block .hint { margin-bottom: 15px; font-size: 0.85rem; }
    
    /* Увеличиваем высоту формы на телефонах, так как элементы встают в столбик */
    #form-iframe { min-height: 1150px; }
    
    .chart-item { padding: 10px; }
    
    /* Удобный крестик для закрытия на телефоне */
    .modal-close { 
      font-size: 45px; 
      top: 10px; 
      right: 20px; 
    }
  }
</style>
</head>
<body>

<header>
  <h1>Опитування</h1>
  <p>Заповніть коротку форму нижче — це займе лише пару хвилин. Дякуємо за вашу участь!</p>
</header>

<div class="container">

  <h2 class="section-title">Три ключові моменти</h2>

  <div class="gallery">
    <div class="gallery-item">
      <img src="image/1.png" alt="фото 1">
    </div>
    <div class="gallery-item">
      <img src="image/2.png" alt="фото 2">
    </div>
    <div class="gallery-item">
      <img src="image/3.png" alt="фото 3">
    </div>
  </div>

  <!-- GOOGLE FORM -->
  <div class="embed-block">
    <h2>Заповніть форму</h2>
    <p class="hint">Ваша участь дуже важлива 🌿</p>
    <iframe
      id="form-iframe"
      src="https://docs.google.com/forms/d/e/1FAIpQLSciqfoOBoKhhhdPA2gYWNJuJLFhY8l4k-LoTFPgRTqaG5sABw/viewform?embedded=true"
      title="Google Form"
      loading="lazy">
      Завантаження…
    </iframe>
  </div>

  <!-- РЕЗУЛЬТАТИ (6 ГРАФИКОВ) -->
  <div class="embed-block">
    <h2>Результати опитування</h2>
    <p class="hint">Натисніть на будь-який графік, щоб збільшити його</p>
    
    <div class="charts-grid">
      
      <div class="chart-item">
        <img src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSpVY2PYJ0O0EJumGPWD7nmpd9MZci4yp7G5XDpwlvOZGgjd5G5yz-FMfLhyubwQXVPnYfQFLjvXRXP/pubchart?oid=1398187329&amp;format=image" alt="Графік 1" loading="lazy">
      </div>
      
      <div class="chart-item">
        <img src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSpVY2PYJ0O0EJumGPWD7nmpd9MZci4yp7G5XDpwlvOZGgjd5G5yz-FMfLhyubwQXVPnYfQFLjvXRXP/pubchart?oid=671936048&amp;format=image" alt="Графік 2" loading="lazy">
      </div>
      
      <div class="chart-item">
        <img src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSpVY2PYJ0O0EJumGPWD7nmpd9MZci4yp7G5XDpwlvOZGgjd5G5yz-FMfLhyubwQXVPnYfQFLjvXRXP/pubchart?oid=730985325&amp;format=image" alt="Графік 3" loading="lazy">
      </div>
      
      <div class="chart-item">
        <img src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSpVY2PYJ0O0EJumGPWD7nmpd9MZci4yp7G5XDpwlvOZGgjd5G5yz-FMfLhyubwQXVPnYfQFLjvXRXP/pubchart?oid=649855574&amp;format=image" alt="Графік 4" loading="lazy">
      </div>
      
      <div class="chart-item">
        <img src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSpVY2PYJ0O0EJumGPWD7nmpd9MZci4yp7G5XDpwlvOZGgjd5G5yz-FMfLhyubwQXVPnYfQFLjvXRXP/pubchart?oid=819596410&amp;format=image" alt="Графік 5" loading="lazy">
      </div>
      
      <div class="chart-item">
        <img src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSpVY2PYJ0O0EJumGPWD7nmpd9MZci4yp7G5XDpwlvOZGgjd5G5yz-FMfLhyubwQXVPnYfQFLjvXRXP/pubchart?oid=650506181&amp;format=image" alt="Графік 6" loading="lazy">
      </div>

    </div>
  </div>

</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="imageModal" class="modal">
  <span class="modal-close">&times;</span>
  <img class="modal-content" id="modalImage" alt="Збільшений графік">
</div>

<footer>
  © 2026 · Зроблено з <span>зеленим настроєм</span> 🌿
</footer>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImage");
    const closeBtn = document.querySelector(".modal-close");
    const chartImages = document.querySelectorAll(".chart-item img");

    chartImages.forEach(img => {
      img.addEventListener("click", function() {
        modal.classList.add("active");
        modalImg.src = this.src;
      });
    });

    function closeModal() {
      modal.classList.remove("active");
      setTimeout(() => { modalImg.src = ""; }, 300); 
    }

    closeBtn.addEventListener("click", closeModal);

    modal.addEventListener("click", function(event) {
      if (event.target === modal) {
        closeModal();
      }
    });

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape" && modal.classList.contains("active")) {
        closeModal();
      }
    });
  });
</script>

</body>
</html>
